name: CD

# Builds the API image once, publishes it to GHCR (for compose / self-hosting) AND to the Fly.io registry,
# then deploys that exact image to the Fly app declared in fly.toml. The API self-applies both EF migration
# chains on boot (Database__AutoMigrate=true, single Machine).
#
# Required repo secret:  FLY_API_TOKEN (a deploy token for the app: `flyctl tokens create deploy -a gymbro-api`).
on:
  push:
    branches: [main, master]
    tags: ['v*']

# One deploy at a time — never let two pushes race to update the single Machine.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate: run the full CI suite (build + tests) before anything ships. CD never builds or
  # deploys a red commit. CI declares `workflow_call`, so this reuses it — no duplicated steps.
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to the Fly.io registry
        uses: docker/login-action@v3
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            registry.fly.io/gymbro-api:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # for fly.toml

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy the built image to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --image registry.fly.io/gymbro-api:${{ github.sha }} --config fly.toml
